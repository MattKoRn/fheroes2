name: RPG AI continuation patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rpg_ai_continue_once.yml'

permissions:
  contents: write

jobs:
  patch-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply strategic AI continuation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          planner_h = "src/fheroes2/ai/ai_planner.h"
          old = """        // The following member variables should not be saved or serialized\n\n        std::unordered_map<int32_t, MP2::MapObjectType> _mapActionObjects;\n"""
          new = """        struct HeroPlanMemory\n        {\n            uint32_t lastStrategicInterruptDay{ 0 };\n            int32_t lastStrategicInterruptTile{ -1 };\n        };\n\n        // The following member variables should not be saved or serialized\n\n        // Bounded per-hero planning memory. Hero IDs are finite, so this prevents newly discovered\n        // low-priority objects from repeatedly breaking an established multi-turn route while\n        // remaining deterministic and cheap to query.\n        std::unordered_map<int32_t, HeroPlanMemory> _heroPlanMemory;\n        std::unordered_map<int32_t, MP2::MapObjectType> _mapActionObjects;\n"""
          replace_once(planner_h, old, new)

          planner_cpp = "src/fheroes2/ai/ai_planner.cpp"
          old = """#include \"world.h\"\n\nAI::Planner & AI::Planner::Get()\n"""
          new = """#include \"world.h\"\n\nnamespace\n{\n    bool isStrategicDiscovery( const MP2::MapObjectType object )\n    {\n        switch ( object ) {\n        case MP2::OBJ_CASTLE:\n        case MP2::OBJ_HERO:\n        case MP2::OBJ_MINE:\n        case MP2::OBJ_SAWMILL:\n        case MP2::OBJ_ALCHEMIST_LAB:\n        case MP2::OBJ_ABANDONED_MINE:\n        case MP2::OBJ_ARTIFACT:\n        case MP2::OBJ_LIGHTHOUSE:\n            return true;\n        default:\n            return false;\n        }\n    }\n}\n\nAI::Planner & AI::Planner::Get()\n"""
          replace_once(planner_cpp, old, new)

          old = """    updateMapActionObjectCache( kingdom, tile.GetIndex() );\n    updatePriorityAttackTarget( kingdom, tile );\n\n    // If this is an action object and one of AI heroes is moving,\n    // we have to stop him because the new object might be more valuable than the current target.\n    const VecHeroes & heroes = kingdom.GetHeroes();\n    for ( Heroes * hero : heroes ) {\n        if ( hero == nullptr ) {\n            // How is it even possible?\n            assert( 0 );\n            continue;\n        }\n\n        if ( hero->isMoveEnabled() ) {\n            hero->GetPath().Truncate();\n            break;\n        }\n    }\n"""
          new = """    updateMapActionObjectCache( kingdom, tile.GetIndex() );\n    updatePriorityAttackTarget( kingdom, tile );\n\n    const int32_t discoveryIndex = tile.GetIndex();\n    const bool criticalDiscovery = isCriticalTask( discoveryIndex );\n\n    // Routine pickups should not make a hero abandon a good multi-turn plan. Strategic discoveries\n    // can interrupt a route, while critical attack/defence tasks always remain immediately reactive.\n    if ( !criticalDiscovery && !isStrategicDiscovery( object ) ) {\n        return;\n    }\n\n    const uint32_t currentDay = world.CountDay();\n    const VecHeroes & heroes = kingdom.GetHeroes();\n    for ( Heroes * hero : heroes ) {\n        if ( hero == nullptr ) {\n            // How is it even possible?\n            assert( 0 );\n            continue;\n        }\n\n        if ( !hero->isMoveEnabled() ) {\n            continue;\n        }\n\n        HeroPlanMemory & memory = _heroPlanMemory[hero->GetID()];\n        const bool alreadyReplannedToday = memory.lastStrategicInterruptDay == currentDay;\n\n        // Preserve plan stickiness for ordinary strategic discoveries: at most one route interruption\n        // per hero per day. Critical defence/attack tasks are allowed to override this guard.\n        if ( !criticalDiscovery && alreadyReplannedToday ) {\n            break;\n        }\n\n        memory.lastStrategicInterruptDay = currentDay;\n        memory.lastStrategicInterruptTile = discoveryIndex;\n        hero->GetPath().Truncate();\n        break;\n    }\n"""
          replace_once(planner_cpp, old, new)

          battle_cpp = "src/fheroes2/ai/ai_battle.cpp"
          old = """    // If an offensive tactic is chosen, then this means that, most likely, the enemy has more shooters, which means that we should try to attack the enemy and\n    // neutralize his shooters as quickly as possible. A cautious offensive tactics can be chosen only if our army is fighting an enemy army that has limited\n    // distance attack capabilities.\n    _cautiousOffensive = ( enemyArcherRatio < 0.15 );\n\n    DEBUG_LOG( DBG_BATTLE, DBG_INFO,\n               ( _defensiveTactics ? \"Defensive\" : ( _cautiousOffensive ? \"Cautious offensive\" : \"Offensive\" ) )\n                   << \" tactics have been chosen. Army strength: \" << _myArmyStrength << \", shooters strength: \" << _myShootersStrength\n                   << \", enemy army strength: \" << _enemyArmyStrength << \", enemy shooters strength: \" << _enemyShootersStrength )\n"""
          new = """    // Choose the offensive tempo from the whole battle state instead of only the enemy archer ratio.\n    // An attrited or weaker army preserves valuable stacks when the enemy cannot force the pace, while a\n    // clearly superior army closes decisively. Enemy shooters or meaningful spell pressure still demand tempo.\n    const double relativeArmyStrength = _myArmyStrength / _enemyArmyStrength;\n    const bool enemyCanForceTempo = enemyArcherRatio >= 0.15 || _enemySpellStrength > _myArmyStrength * 0.20;\n    const bool preservationMatters = _considerRetreat || relativeArmyStrength < 1.25;\n    _cautiousOffensive = !enemyCanForceTempo && preservationMatters;\n\n    DEBUG_LOG( DBG_BATTLE, DBG_INFO,\n               ( _defensiveTactics ? \"Defensive\" : ( _cautiousOffensive ? \"Cautious offensive\" : \"Offensive\" ) )\n                   << \" tactics have been chosen. Army strength: \" << _myArmyStrength << \", shooters strength: \" << _myShootersStrength\n                   << \", enemy army strength: \" << _enemyArmyStrength << \", enemy shooters strength: \" << _enemyShootersStrength\n                   << \", relative strength: \" << relativeArmyStrength << \", enemy spell pressure: \" << _enemySpellStrength\n                   << \", preservation needed: \" << preservationMatters )\n"""
          replace_once(battle_cpp, old, new)

      - name: Validate patch
        run: |
          git diff --check
          git diff -- src/fheroes2/ai/ai_planner.h src/fheroes2/ai/ai_planner.cpp src/fheroes2/ai/ai_battle.cpp

      - name: Commit continuation to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fheroes2/ai/ai_planner.h src/fheroes2/ai/ai_planner.cpp src/fheroes2/ai/ai_battle.cpp
          git commit -m "Improve RPG adventure and battle AI planning"
          git push origin HEAD:main
